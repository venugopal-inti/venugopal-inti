<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venugopal Inti — IT Infrastructure Engineer</title>
<meta name="description" content="Desktop Support Engineer · MDM · SCCM · ServiceNow · Hyderabad">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* =====================================================
   TOKENS
   ===================================================== */
:root{
  --bg:       #020408;
  --bg2:      #040810;
  --panel:    #060d18;
  --panel2:   #081020;
  --border:   rgba(0,255,136,0.12);
  --border2:  rgba(0,255,136,0.06);
  --border3:  rgba(0,255,136,0.25);

  --green:    #00ff88;
  --green2:   #00cc6a;
  --green3:   rgba(0,255,136,0.08);
  --greenglow:rgba(0,255,136,0.15);

  --blue:     #00b4ff;
  --blue2:    rgba(0,180,255,0.08);
  --amber:    #ffb800;
  --red:      #ff4444;
  --purple:   #7c3aed;

  --text:     #e2f0e8;
  --soft:     #6b8a72;
  --muted:    #2a3d30;
  --dim:      #1a2820;

  --font-mono:'JetBrains Mono',monospace;
  --font-body:'Inter',sans-serif;
  --font-hud: 'Orbitron',sans-serif;
}

/* =====================================================
   RESET
   ===================================================== */
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  font-family:var(--font-body);
  color:var(--text);
  overflow-x:hidden;
  cursor:crosshair;
}

/* =====================================================
   CANVAS — MATRIX PARTICLES
   ===================================================== */
#matrix-canvas{
  position:fixed;inset:0;z-index:0;
  opacity:0.07;pointer-events:none;
}

/* Scan line overlay */
body::after{
  content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    transparent,transparent 2px,
    rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px
  );
}

/* =====================================================
   INTRO SCREEN
   ===================================================== */
#intro-screen{
  position:fixed;inset:0;z-index:9999;
  background:#000;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 1s ease,visibility 1s ease;
}
#intro-screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
#intro-inner{max-width:720px;width:100%;padding:40px 28px;}

/* BIOS style header */
.bios-header{
  font-family:var(--font-mono);font-size:11px;
  color:var(--soft);margin-bottom:24px;
  border-bottom:1px solid var(--muted);padding-bottom:12px;
  letter-spacing:0.5px;
}
.bios-header span{color:var(--green);}

#intro-text{
  font-family:var(--font-mono);
  font-size:clamp(12px,1.8vw,16px);
  line-height:2;color:var(--green);
  min-height:300px;white-space:pre-wrap;
  word-break:break-word;
}
.it-dim{color:var(--muted);}
.it-white{color:#c8ddd0;}
.it-green{color:var(--green);font-weight:600;}
.it-blue{color:var(--blue);}
.it-amber{color:var(--amber);}
.it-cursor{
  display:inline-block;width:9px;height:1em;
  background:var(--green);margin-left:1px;
  animation:blink .6s step-end infinite;
  vertical-align:text-bottom;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

#intro-skip{
  margin-top:24px;font-family:var(--font-mono);
  font-size:10px;letter-spacing:2px;color:var(--muted);
  cursor:pointer;transition:color .2s;text-transform:uppercase;
  display:inline-block;
}
#intro-skip:hover{color:var(--green);}

/* =====================================================
   LAYOUT
   ===================================================== */
.os-chrome{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  border:1px solid var(--border);
}
.os-topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(2,4,8,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:48px;
}
.os-logo{
  font-family:var(--font-hud);font-size:12px;font-weight:700;
  color:var(--green);letter-spacing:2px;
  display:flex;align-items:center;gap:10px;
}
.os-logo-dot{
  width:8px;height:8px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px var(--green);animation:pulse-dot 2s infinite;
}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 6px var(--green);}50%{box-shadow:0 0 16px var(--green),0 0 32px rgba(0,255,136,0.3);}}

.os-nav{display:flex;align-items:center;gap:4px;}
.os-nav a{
  font-family:var(--font-mono);font-size:10px;letter-spacing:1px;
  color:var(--soft);text-decoration:none;padding:6px 12px;border-radius:4px;
  transition:all .2s;text-transform:uppercase;
}
.os-nav a:hover{color:var(--green);background:var(--green3);}

.os-status{display:flex;align-items:center;gap:14px;}
.os-clock{
  font-family:var(--font-mono);font-size:11px;color:var(--soft);letter-spacing:1px;
}
.os-badge{
  font-family:var(--font-mono);font-size:10px;
  color:var(--green);border:1px solid var(--border3);
  border-radius:3px;padding:3px 8px;letter-spacing:1px;
  background:var(--green3);
  animation:border-glow 3s infinite;
}
@keyframes border-glow{
  0%,100%{box-shadow:0 0 4px rgba(0,255,136,0.2);}
  50%{box-shadow:0 0 12px rgba(0,255,136,0.4);}
}

.main-wrap{
  position:relative;z-index:3;
  max-width:1040px;margin:0 auto;
  padding:80px 24px 100px;
}

/* =====================================================
   SCROLL REVEAL
   ===================================================== */
.reveal,.reveal-left,.reveal-scale{
  opacity:0;transition:opacity .8s ease,transform .8s ease;
}
.reveal{transform:translateY(28px);}
.reveal-left{transform:translateX(-28px);}
.reveal-scale{transform:scale(0.95);}
.reveal.on,.reveal-left.on,.reveal-scale.on{opacity:1;transform:none;}
.d1{transition-delay:.1s;}.d2{transition-delay:.2s;}
.d3{transition-delay:.3s;}.d4{transition-delay:.4s;}

/* =====================================================
   SECTION LABELS
   ===================================================== */
.sec-label{
  font-family:var(--font-mono);font-size:10px;
  color:var(--soft);letter-spacing:3px;text-transform:uppercase;
  display:flex;align-items:center;gap:12px;margin-bottom:8px;
}
.sec-label::before{content:'//';color:var(--green);margin-right:2px;}
.sec-label-line{flex:1;height:1px;background:var(--border2);}

.sec-title{
  font-family:var(--font-hud);
  font-size:clamp(16px,2.5vw,22px);
  font-weight:700;color:var(--text);
  letter-spacing:2px;margin-bottom:28px;
}
.sec-title span{color:var(--green);}

/* =====================================================
   HERO
   ===================================================== */
.hero{
  min-height:calc(100vh - 80px);
  display:flex;align-items:center;
  padding:40px 0 60px;
  gap:48px;
  margin-bottom:0;
}
.hero-left{flex:1;}
.hero-right{
  flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;gap:16px;
}

/* HUD frame around hero text */
.hud-frame{
  position:relative;padding:32px 36px;
  border:1px solid var(--border);border-radius:4px;
  background:rgba(6,13,24,0.8);backdrop-filter:blur(8px);
  margin-bottom:32px;
}
.hud-frame::before,.hud-frame::after{
  content:'';position:absolute;
  width:14px;height:14px;
  border-color:var(--green);border-style:solid;
}
.hud-frame::before{top:-1px;left:-1px;border-width:2px 0 0 2px;}
.hud-frame::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}

.hero-system-id{
  font-family:var(--font-mono);font-size:10px;
  color:var(--soft);letter-spacing:2px;margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.hero-system-id span{color:var(--green);}

.hero-name{
  font-family:var(--font-hud);
  font-size:clamp(32px,5vw,58px);
  font-weight:900;line-height:1.1;
  color:var(--text);
  letter-spacing:2px;
  margin-bottom:6px;
  -webkit-font-smoothing:antialiased;
}
.hero-name .accent{
  color:var(--green);
  text-shadow:0 0 20px rgba(0,255,136,0.4);
}
.hero-designation{
  font-family:var(--font-mono);font-size:13px;
  color:var(--blue);letter-spacing:3px;margin-bottom:20px;
  text-transform:uppercase;
}

.hero-bio{
  font-size:14px;color:var(--soft);line-height:1.9;
  max-width:520px;margin-bottom:0;
  font-weight:400;
}
.hero-bio strong{color:var(--green);font-weight:600;}

/* Tag chips */
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;margin-bottom:28px;}
.chip{
  font-family:var(--font-mono);font-size:10px;letter-spacing:1px;
  padding:5px 12px;border-radius:3px;
  border:1px solid var(--border);color:var(--soft);
  background:var(--green3);transition:all .2s;
}
.chip:hover{border-color:var(--green);color:var(--green);}
.chip.hi{border-color:rgba(0,180,255,0.2);color:var(--blue);background:var(--blue2);}

.hero-actions{display:flex;gap:12px;flex-wrap:wrap;}

/* CTA buttons */
.btn-primary{
  font-family:var(--font-mono);font-size:11px;letter-spacing:2px;
  text-transform:uppercase;padding:12px 24px;
  border:1px solid var(--green);border-radius:3px;
  background:var(--green3);color:var(--green);
  text-decoration:none;transition:all .2s;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
  position:relative;overflow:hidden;
}
.btn-primary::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,255,136,0.1),transparent);
  opacity:0;transition:opacity .2s;
}
.btn-primary:hover{
  background:rgba(0,255,136,0.12);
  box-shadow:0 0 20px rgba(0,255,136,0.2);
}
.btn-primary:hover::before{opacity:1;}

.btn-secondary{
  font-family:var(--font-mono);font-size:11px;letter-spacing:2px;
  text-transform:uppercase;padding:12px 24px;
  border:1px solid var(--border);border-radius:3px;
  background:transparent;color:var(--soft);
  text-decoration:none;transition:all .2s;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
}
.btn-secondary:hover{border-color:var(--soft);color:var(--text);}

/* Profile monitor */
.monitor-wrap{position:relative;}
.monitor{
  width:200px;
  background:var(--panel);
  border:1px solid var(--border);border-radius:6px;
  overflow:hidden;position:relative;
}
.monitor-screen{
  position:relative;overflow:hidden;
  background:#000;
}
.monitor-photo{
  width:200px;height:200px;object-fit:cover;
  object-position:top;display:block;filter:brightness(0.9) contrast(1.1);
}
.monitor-photo-fallback{
  width:200px;height:200px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-hud);font-size:48px;font-weight:900;
  color:var(--green);background:#020408;
}
/* Scanline over photo */
.monitor-screen::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,136,0.03) 3px,rgba(0,255,136,0.03) 4px);
  pointer-events:none;
}
/* Green tint overlay */
.monitor-screen::before{
  content:'';position:absolute;inset:0;z-index:1;
  background:rgba(0,255,136,0.04);pointer-events:none;
}
.monitor-hud{
  padding:10px 12px;
  border-top:1px solid var(--border);
  background:var(--panel2);
}
.monitor-hud-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:6px;
}
.monitor-hud-name{
  font-family:var(--font-mono);font-size:11px;
  color:var(--green);font-weight:600;letter-spacing:0.5px;
}
.monitor-hud-role{
  font-family:var(--font-mono);font-size:9px;
  color:var(--soft);letter-spacing:1px;text-transform:uppercase;
}
.monitor-status-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 6px var(--green);
  animation:pulse-dot 2s infinite;
}
.monitor-stand{
  width:60px;height:12px;background:var(--panel);
  border:1px solid var(--border);border-top:none;
  margin:0 auto;border-radius:0 0 4px 4px;
}

/* HUD stats under monitor */
.hud-pills{display:flex;flex-direction:column;gap:6px;width:200px;margin-top:12px;}
.hud-pill{
  font-family:var(--font-mono);font-size:10px;
  display:flex;align-items:center;gap:8px;
  padding:7px 10px;border-radius:3px;
  border:1px solid var(--border2);
  background:var(--panel);color:var(--soft);letter-spacing:0.5px;
  transition:border-color .2s;
}
.hud-pill:hover{border-color:var(--border3);}
.hud-pill .hi{color:var(--green);}

/* =====================================================
   STATS — TERMINAL PANELS
   ===================================================== */
.stats-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:14px;margin:60px 0;
}
.stat-panel{
  background:var(--panel);
  border:1px solid var(--border2);border-radius:4px;
  padding:20px 16px;text-align:center;
  position:relative;overflow:hidden;
  transition:border-color .2s,transform .2s;
  cursor:default;
}
.stat-panel:hover{border-color:var(--border3);transform:translateY(-4px);}
.stat-panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--green),transparent);
  opacity:0;transition:opacity .2s;
}
.stat-panel:hover::before{opacity:1;}
.stat-num{
  font-family:var(--font-hud);font-size:28px;font-weight:900;
  color:var(--green);line-height:1;
  text-shadow:0 0 16px rgba(0,255,136,0.3);
}
.stat-lbl{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:6px;letter-spacing:1px;text-transform:uppercase;}
.stat-sub{font-family:var(--font-mono);font-size:10px;margin-top:8px;color:var(--soft);}

/* =====================================================
   APPRECIATION — LOG ENTRIES
   ===================================================== */
.log-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:60px;}
.log-entry{
  background:var(--panel);border:1px solid var(--border2);
  border-radius:4px;padding:24px;position:relative;overflow:hidden;
  transition:border-color .2s,transform .2s;
}
.log-entry:hover{border-color:var(--border3);transform:translateY(-3px);}
.log-entry::before{
  content:'';position:absolute;top:0;left:0;bottom:0;width:2px;
  background:linear-gradient(180deg,var(--green),transparent);
}
.log-entry.wide{grid-column:1/-1;}
.log-entry.alt{
  background:linear-gradient(135deg,#050d08,#040810);
  border-color:rgba(0,255,136,0.1);
}
.log-timestamp{
  font-family:var(--font-mono);font-size:9px;
  color:var(--muted);letter-spacing:1.5px;margin-bottom:8px;
  text-transform:uppercase;
}
.log-timestamp span{color:var(--green);}
.log-quote{
  font-family:var(--font-mono);font-size:11px;
  color:var(--soft);line-height:1.9;margin-bottom:18px;
}
.log-quote strong{color:var(--green);}
.log-meta{
  display:flex;align-items:center;gap:10px;
  padding-top:14px;border-top:1px solid var(--border2);
}
.log-icon{
  width:32px;height:32px;border-radius:4px;flex-shrink:0;
  background:var(--green3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:13px;
}
.log-name{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--text);}
.log-role{font-family:var(--font-mono);font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:0.5px;}
.log-badge{
  margin-left:auto;font-family:var(--font-mono);font-size:9px;
  padding:2px 8px;border-radius:2px;font-weight:600;
  background:var(--green3);border:1px solid var(--border);color:var(--green);
  white-space:nowrap;letter-spacing:0.5px;
}
.log-reply{
  margin-top:12px;padding:10px 12px;
  background:rgba(0,255,136,0.03);
  border-left:2px solid var(--green2);border-radius:0 4px 4px 0;
}
.log-reply-from{font-family:var(--font-mono);font-size:9px;color:var(--green);margin-bottom:3px;letter-spacing:0.5px;}
.log-reply-text{font-family:var(--font-mono);font-size:11px;color:var(--soft);}
.log-reply-text strong{color:var(--green);}

/* =====================================================
   CERTIFICATION
   ===================================================== */
.cert-panel{
  background:linear-gradient(135deg,#040c07,#040810);
  border:1px solid rgba(0,255,136,0.2);
  border-radius:4px;padding:28px 32px;margin-bottom:60px;
  display:flex;align-items:center;gap:28px;
  position:relative;overflow:hidden;
}
.cert-panel::before{
  content:'VERIFIED';position:absolute;right:24px;top:50%;
  transform:translateY(-50%) rotate(-15deg);
  font-family:var(--font-hud);font-size:40px;font-weight:900;
  color:rgba(0,255,136,0.04);letter-spacing:4px;pointer-events:none;
  user-select:none;
}
.cert-icon-wrap{
  width:72px;height:72px;flex-shrink:0;border-radius:50%;
  background:var(--green3);
  border:2px solid var(--green);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow:0 0 0 6px rgba(0,255,136,0.06),0 0 20px rgba(0,255,136,0.1);
}
.cert-info{flex:1;}
.cert-issuer{font-family:var(--font-mono);font-size:9px;color:var(--green);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
.cert-name{font-family:var(--font-hud);font-size:18px;font-weight:700;color:var(--text);margin-bottom:5px;letter-spacing:1px;}
.cert-detail{font-family:var(--font-mono);font-size:11px;color:var(--soft);}
.cert-detail strong{color:var(--green);}
.cert-tags{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;}
.cert-tag{
  font-family:var(--font-mono);font-size:9px;padding:3px 10px;border-radius:2px;
  background:rgba(0,255,136,0.06);border:1px solid rgba(0,255,136,0.15);
  color:var(--green);font-weight:600;letter-spacing:0.5px;
}

/* =====================================================
   SKILLS — PROGRESS BARS
   ===================================================== */
.skills-terminal{
  background:var(--panel);border:1px solid var(--border2);
  border-radius:4px;overflow:hidden;margin-bottom:14px;
}
.skills-terminal-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;background:var(--panel2);
  border-bottom:1px solid var(--border2);
}
.terminal-dot{width:10px;height:10px;border-radius:50%;}
.terminal-dot.red{background:#ff5f57;}
.terminal-dot.yellow{background:#febc2e;}
.terminal-dot.green{background:#28c840;}
.terminal-title{
  font-family:var(--font-mono);font-size:10px;color:var(--muted);
  letter-spacing:1px;margin-left:6px;
}
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:24px;}
.skill-item{display:flex;flex-direction:column;gap:7px;}
.skill-header{display:flex;justify-content:space-between;}
.skill-name{font-family:var(--font-mono);font-size:11px;color:var(--soft);letter-spacing:0.5px;}
.skill-pct{font-family:var(--font-mono);font-size:11px;color:var(--green);font-weight:600;}
.skill-bar{height:3px;background:var(--dim);border-radius:1px;overflow:hidden;}
.skill-fill{
  height:100%;border-radius:1px;
  background:linear-gradient(90deg,var(--green2),var(--green));
  box-shadow:0 0 6px rgba(0,255,136,0.4);
  transition:width 1.4s cubic-bezier(.4,0,.2,1);
}

/* =====================================================
   TOOLS — CHIP CLOUD
   ===================================================== */
.tools-panel{
  background:var(--panel);border:1px solid var(--border2);
  border-radius:4px;padding:24px;margin-bottom:60px;
}
.tools-label{
  font-family:var(--font-mono);font-size:9px;color:var(--muted);
  letter-spacing:2px;margin-bottom:16px;text-transform:uppercase;
}
.tool-chips{display:flex;flex-wrap:wrap;gap:8px;}
.tool-chip{
  font-family:var(--font-mono);font-size:10px;letter-spacing:0.5px;
  padding:5px 12px;border-radius:2px;font-weight:500;
  transition:all .15s;cursor:default;
}
.tc1{background:rgba(0,180,255,0.06);border:1px solid rgba(0,180,255,0.15);color:#60b8ff;}
.tc2{background:rgba(124,58,237,0.06);border:1px solid rgba(124,58,237,0.15);color:#a78bfa;}
.tc3{background:rgba(0,255,136,0.06);border:1px solid rgba(0,255,136,0.12);color:var(--green);}
.tc4{background:rgba(255,184,0,0.06);border:1px solid rgba(255,184,0,0.15);color:#fcd34d;}
.tc5{background:rgba(255,68,68,0.06);border:1px solid rgba(255,68,68,0.12);color:#f87171;}
