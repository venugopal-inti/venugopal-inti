<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venugopal Inti — IT Infrastructure Portfolio</title>
<meta name="description" content="Desktop Support Engineer with 6+ years in MDM, SCCM, ServiceNow, Citrix VDI. Open to Work. Hyderabad.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — Dark Luxury Gold
   ============================================================ */
:root{
  --bg:       #060810;
  --bg2:      #090c16;
  --surface:  #0d1121;
  --surface2: #111628;
  --border:   rgba(212,175,95,0.12);
  --border2:  rgba(255,255,255,0.05);

  --gold:     #d4af5f;
  --gold2:    #f0d080;
  --gold3:    #b8943f;
  --goldglow: rgba(212,175,95,0.18);
  --goldtint: rgba(212,175,95,0.07);

  --text:     #f0f2f8;
  --soft:     #8892a4;
  --muted:    #3d4560;
  --white:    #ffffff;

  --green:    #34d399;
  --blue:     #60a5fa;
  --purple:   #a78bfa;
  --red:      #f87171;
  --amber:    #fbbf24;

  --radius:   14px;
  --radius-lg:20px;
  --radius-sm:8px;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  font-family:'Inter',sans-serif;
  color:var(--text);
  overflow-x:hidden;
  line-height:1.6;
}

/* Subtle noise texture overlay */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 60% at 50% -5%, rgba(212,175,95,0.07) 0%, transparent 65%),
    radial-gradient(ellipse 50% 40% at 90% 90%, rgba(96,165,250,0.04) 0%, transparent 55%),
    radial-gradient(ellipse 40% 30% at 10% 70%, rgba(167,139,250,0.03) 0%, transparent 50%);
}

/* ============================================================
   INTRO SCREEN
   ============================================================ */
#intro-screen{
  position:fixed;inset:0;z-index:9999;
  background:#02030a;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 1s ease, visibility 1s ease;
}
#intro-screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
#intro-inner{max-width:680px;width:100%;padding:32px 28px;}
#intro-text{
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(12px,2vw,17px);
  line-height:2.1;color:#d4af5f;
  min-height:280px;white-space:pre-wrap;word-break:break-word;
}
.it-dim{color:#2a3050;}
.it-white{color:#f0f2f8;}
.it-green{color:#34d399;}
.it-blue{color:#60a5fa;}
.it-gold{color:#f0d080;font-weight:600;}
.it-cursor{
  display:inline-block;width:9px;height:1.1em;
  background:#d4af5f;margin-left:2px;
  animation:blink .7s step-end infinite;
  vertical-align:text-bottom;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
#intro-skip{
  margin-top:28px;font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:2.5px;color:#2a3050;
  cursor:pointer;transition:color .2s;text-transform:uppercase;
  display:inline-block;
}
#intro-skip:hover{color:#d4af5f;}

/* ============================================================
   SCROLL REVEAL
   ============================================================ */
.reveal,.reveal-left,.reveal-up,.reveal-scale{
  opacity:0;transition:opacity .75s ease,transform .75s ease;
}
.reveal{transform:translateY(24px);}
.reveal-left{transform:translateX(-24px);}
.reveal-up{transform:translateY(40px);}
.reveal-scale{transform:scale(0.96);}
.reveal.on,.reveal-left.on,.reveal-up.on,.reveal-scale.on{
  opacity:1;transform:none;
}
.d1{transition-delay:.1s;}.d2{transition-delay:.18s;}
.d3{transition-delay:.26s;}.d4{transition-delay:.34s;}

/* ============================================================
   LAYOUT
   ============================================================ */
.wrap{
  max-width:1000px;margin:0 auto;
  padding:0 24px 100px;
  position:relative;z-index:1;
}

/* ============================================================
   NAV / TOPBAR
   ============================================================ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:24px 0 28px;
  border-bottom:1px solid var(--border);
  margin-bottom:64px;flex-wrap:wrap;gap:14px;
}
.topbar-logo{display:flex;align-items:center;gap:14px;}
.logo-mark{
  width:42px;height:42px;border-radius:10px;
  background:linear-gradient(135deg,var(--gold),var(--gold3));
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#000;
  font-family:'Cormorant Garamond',serif;letter-spacing:0.5px;
  box-shadow:0 0 0 1px rgba(212,175,95,0.3),0 4px 16px rgba(212,175,95,0.2);
}
.logo-text{
  display:flex;flex-direction:column;
}
.logo-name{font-size:13px;font-weight:600;color:var(--text);letter-spacing:0.3px;}
.logo-sub{font-size:11px;color:var(--soft);letter-spacing:0.3px;margin-top:1px;}

.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.open-badge{
  display:flex;align-items:center;gap:7px;
  background:rgba(52,211,153,0.07);
  border:1px solid rgba(52,211,153,0.2);
  border-radius:20px;padding:6px 14px;
  font-size:11px;font-weight:600;color:var(--green);letter-spacing:0.3px;
}
.pulse{
  width:6px;height:6px;border-radius:50%;background:var(--green);
  animation:pulse 2s infinite;flex-shrink:0;
}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,211,153,0.4);}50%{opacity:.8;box-shadow:0 0 0 5px rgba(52,211,153,0);}}

.btn-gold{
  display:inline-flex;align-items:center;gap:7px;
  background:linear-gradient(135deg,var(--gold),var(--gold3));
  color:#000;font-weight:700;font-size:12px;letter-spacing:0.4px;
  padding:9px 18px;border-radius:var(--radius-sm);text-decoration:none;
  box-shadow:0 4px 16px rgba(212,175,95,0.25);
  transition:transform .2s,box-shadow .2s;border:none;cursor:pointer;
  font-family:'Inter',sans-serif;
}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(212,175,95,0.4);}
.btn-outline{
  display:inline-flex;align-items:center;gap:7px;
  background:transparent;
  border:1px solid var(--border);
  color:var(--soft);font-weight:500;font-size:12px;letter-spacing:0.3px;
  padding:9px 18px;border-radius:var(--radius-sm);text-decoration:none;
  transition:all .2s;
}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  display:grid;grid-template-columns:1fr 200px;
  gap:48px;align-items:center;
  margin-bottom:72px;
}
.hero-eyebrow{
  display:flex;align-items:center;gap:12px;margin-bottom:20px;
}
.eyebrow-line{width:28px;height:1px;background:var(--gold);}
.eyebrow-text{
  font-size:10px;letter-spacing:4px;text-transform:uppercase;
  color:var(--gold);font-weight:600;
}
.hero-name{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(52px,7vw,80px);
  font-weight:700;line-height:1;
  color:var(--white);
  margin-bottom:16px;
  letter-spacing:-0.5px;
  -webkit-font-smoothing:antialiased;
}
.hero-name span{color:var(--gold);}
.hero-role{
  font-size:15px;color:var(--soft);line-height:1.85;
  max-width:500px;margin-bottom:28px;font-weight:400;
}
.hero-role strong{color:var(--gold2);font-weight:600;}
.hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:36px;}
.tag{
  font-size:11px;padding:5px 13px;border-radius:20px;
  font-weight:500;letter-spacing:0.3px;
  background:var(--goldtint);
  border:1px solid var(--border);
  color:var(--gold2);
}
.tag.blue{
  background:rgba(96,165,250,0.07);
  border-color:rgba(96,165,250,0.15);
  color:var(--blue);
}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap;}

/* Profile card */
.profile-card{
  display:flex;flex-direction:column;align-items:center;gap:16px;
}
.profile-photo{
  position:relative;width:160px;height:160px;
}
.profile-photo-ring{
  position:absolute;inset:-4px;border-radius:50%;
  border:1px solid var(--border);
}
.profile-photo-img{
  width:160px;height:160px;border-radius:50%;overflow:hidden;
  border:2px solid rgba(212,175,95,0.3);
  box-shadow:0 0 40px rgba(212,175,95,0.12),0 0 0 8px rgba(212,175,95,0.04);
  background:var(--surface);
}
.profile-photo-img img{
  width:100%;height:100%;object-fit:cover;object-position:top;
}
.profile-photo-fallback{
  display:none;width:100%;height:100%;
  align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:52px;
  font-weight:700;color:var(--gold);
}
.profile-name-tag{text-align:center;}
.profile-name-tag .pname{
  font-family:'Cormorant Garamond',serif;
  font-size:14px;font-weight:600;color:var(--gold2);letter-spacing:1px;
}
.profile-name-tag .prole{
  font-size:10px;color:var(--muted);letter-spacing:2.5px;
  text-transform:uppercase;margin-top:3px;
}
.profile-pills{display:flex;flex-direction:column;gap:6px;width:100%;}
.ppill{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border-radius:var(--radius-sm);padding:7px 12px;
  font-size:11px;color:var(--soft);font-weight:500;
}
.ppill.gold{background:rgba(212,175,95,0.06);border:1px solid rgba(212,175,95,0.12);}
.ppill.green{background:rgba(52,211,153,0.05);border:1px solid rgba(52,211,153,0.12);}
.ppill.blue{background:rgba(96,165,250,0.05);border:1px solid rgba(96,165,250,0.12);}

/* ============================================================
   SECTION HEADINGS
   ============================================================ */
.sec-wrap{margin-bottom:48px;}
.sec-head{display:flex;align-items:center;gap:16px;margin-bottom:6px;}
.sec-title{
  font-family:'Cormorant Garamond',serif;
  font-size:26px;font-weight:600;color:var(--text);
  white-space:nowrap;letter-spacing:0.3px;
}
.sec-rule{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}
.sec-sub{
  font-size:11px;color:var(--gold);letter-spacing:2.5px;
  text-transform:uppercase;font-weight:600;margin-bottom:28px;
}

/* ============================================================
   STATS
   ============================================================ */
.stats-row{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:14px;margin-bottom:72px;
}
.stat{
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:var(--radius);
  padding:24px 16px;text-align:center;
  position:relative;overflow:hidden;
  transition:border-color .25s,transform .25s;
}
.stat:hover{border-color:var(--border);transform:translateY(-4px);}
.stat::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0;transition:opacity .25s;
}
.stat:hover::after{opacity:1;}
.stat-n{
  font-family:'JetBrains Mono',monospace;
  font-size:32px;font-weight:600;color:var(--gold2);line-height:1;
}
.stat-l{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:0.3px;}
.stat-c{font-size:11px;margin-top:8px;color:var(--green);font-weight:500;}

/* ============================================================
   APPRECIATION
   ============================================================ */
.appr-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:18px;margin-bottom:72px;
}
.appr-card{
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:var(--radius-lg);
  padding:28px;position:relative;overflow:hidden;
  transition:border-color .25s,transform .25s;
}
.appr-card:hover{border-color:var(--border);transform:translateY(-3px);}
.appr-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.appr-card.wide{grid-column:1/-1;}
.appr-card.wide-dark{
  background:linear-gradient(135deg,#0a120f,#080e18);
  border-color:rgba(212,175,95,0.1);
}
.qmark{
  font-family:'Cormorant Garamond',serif;
  font-size:64px;color:var(--gold);opacity:0.15;
  line-height:.7;margin-bottom:12px;
}
.appr-text{
  font-size:13px;line-height:1.85;color:#909db8;margin-bottom:22px;
}
.appr-text strong{color:var(--gold2);}
.appr-meta{
  display:flex;align-items:center;gap:12px;
  padding-top:16px;border-top:1px solid var(--border2);
}
.appr-icon{
  width:36px;height:36px;border-radius:9px;flex-shrink:0;
  background:var(--goldtint);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.appr-name{font-size:13px;font-weight:600;color:var(--text);}
.appr-role{font-size:11px;color:var(--muted);margin-top:1px;}
.appr-badge{
  margin-left:auto;font-size:10px;padding:3px 10px;border-radius:20px;
  font-weight:600;background:var(--goldtint);
  border:1px solid var(--border);color:var(--gold);white-space:nowrap;
}
.reply-box{
  margin-top:14px;padding:12px 14px;
  background:rgba(212,175,95,0.04);
  border:1px solid rgba(212,175,95,0.1);border-radius:10px;
}
.reply-from{font-size:10px;color:var(--gold);font-weight:700;margin-bottom:4px;letter-spacing:0.3px;}
.reply-text{font-size:12px;color:var(--soft);font-style:italic;}
.reply-text strong{color:var(--gold2);}

/* ============================================================
   CERTIFICATION
   ============================================================ */
.cert-card{
  background:linear-gradient(135deg,#0a120f,#08101c);
  border:1px solid rgba(212,175,95,0.2);
  border-radius:var(--radius-lg);
  padding:32px 36px;margin-bottom:72px;
  display:flex;align-items:center;gap:32px;
  position:relative;overflow:hidden;
}
.cert-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 50% 100% at 85% 50%,rgba(212,175,95,0.05),transparent);
  pointer-events:none;
}
.cert-seal{
  width:80px;height:80px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),var(--gold3));
  display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 0 0 4px rgba(212,175,95,0.15),0 0 0 8px rgba(212,175,95,0.06);
}
.cert-issued{
  font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--gold);font-weight:600;margin-bottom:6px;
}
.cert-title{
  font-family:'Cormorant Garamond',serif;
  font-size:22px;font-weight:600;color:var(--white);margin-bottom:6px;
}
.cert-detail{font-size:13px;color:var(--soft);}
.cert-detail strong{color:var(--gold2);}
.cert-tags{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.cert-tag{
  font-size:11px;padding:4px 12px;border-radius:6px;
  background:rgba(52,211,153,0.08);
  border:1px solid rgba(52,211,153,0.15);color:var(--green);font-weight:600;
}

/* ============================================================
   SKILLS
   ============================================================ */
.skills-block{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--radius-lg);padding:30px;margin-bottom:18px;
}
.skill-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
.skill-row{display:flex;flex-direction:column;gap:7px;}
.skill-top{display:flex;justify-content:space-between;font-size:12px;}
.skill-name-l{color:var(--soft);font-weight:500;}
.skill-pct{
  color:var(--gold2);
  font-family:'JetBrains Mono',monospace;font-weight:600;
}
.skill-bar{
  height:3px;background:rgba(255,255,255,0.04);
  border-radius:2px;overflow:hidden;
}
.skill-fill{
  height:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--gold3),var(--gold2));
  transition:width 1.4s cubic-bezier(.4,0,.2,1);
}

/* ============================================================
   TOOLS
   ============================================================ */
.tools-block{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--radius-lg);padding:28px;margin-bottom:72px;
}
.tools-wrap{display:flex;flex-wrap:wrap;gap:9px;}
.tool{
  font-size:11px;padding:6px 14px;border-radius:20px;
  font-weight:500;transition:all .2s;cursor:default;letter-spacing:0.2px;
}
.t1{background:rgba(96,165,250,0.08);border:1px solid rgba(96,165,250,0.15);color:#93c5fd;}
.t2{background:rgba(167,139,250,0.08);border:1px solid rgba(167,139,250,0.15);color:#c4b5fd;}
.t3{background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.15);color:#7dd3fc;}
.t4{background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.15);color:#fde68a;}
.t5{background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.15);color:#6ee7b7;}
.tool:hover{transform:translateY(-2px);filter:brightness(1.25);}

/* ============================================================
   TICKET LOG
   ============================================================ */
.dash-panel{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--radius-lg);overflow:hidden;margin-bottom:72px;
}
.tab-bar{display:flex;gap:4px;padding:14px 18px 0;}
.tbtn{
  padding:6px 16px;border-radius:var(--radius-sm);
  font-size:11px;font-weight:600;cursor:pointer;
  border:none;background:transparent;color:var(--muted);
  transition:all .2s;font-family:'Inter',sans-serif;letter-spacing:0.3px;
}
.tbtn.active{background:var(--goldtint);color:var(--gold);border:1px solid var(--border);}
.dash-header{
  padding:14px 20px;border-bottom:1px solid var(--border2);
  display:flex;align-items:center;justify-content:space-between;
}
.dash-htitle{font-size:13px;font-weight:600;color:var(--text);}
.dash-hbadge{
  font-size:11px;background:rgba(52,211,153,0.08);
  border:1px solid rgba(52,211,153,0.2);color:var(--green);
  border-radius:20px;padding:3px 12px;font-weight:600;
}
.ticket-table{width:100%;border-collapse:collapse;}
.ticket-table th{
  font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted);padding:12px 18px;text-align:left;
  border-bottom:1px solid var(--border2);font-weight:600;
}
.ticket-table td{
  padding:11px 18px;font-size:12.5px;
  border-bottom:1px solid rgba(255,255,255,0.025);
}
.ticket-table tr:hover td{background:rgba(212,175,95,0.02);}
.ticket-table tr:last-child td{border-bottom:none;}
.tid{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--muted);
}
.pri{font-size:10px;padding:2px 9px;border-radius:5px;font-weight:600;}
.pri.high{background:rgba(248,113,113,0.1);color:#f87171;}
.pri.medium{background:rgba(251,191,36,0.1);color:#fde68a;}
.pri.low{background:rgba(52,211,153,0.1);color:#6ee7b7;}
.sts{font-size:10px;padding:2px 9px;border-radius:5px;font-weight:600;}
.sts.resolved{background:rgba(52,211,153,0.1);color:#6ee7b7;}

/* ============================================================
   EXPERIENCE TIMELINE
   ============================================================ */
.exp-timeline{
  position:relative;padding-left:32px;margin-bottom:72px;
}
.exp-timeline::before{
  content:'';position:absolute;left:8px;top:10px;bottom:10px;
  width:1px;background:linear-gradient(180deg,var(--gold),rgba(212,175,95,0.05));
}
.exp-item{
  position:relative;background:var(--surface);
  border:1px solid var(--border2);border-radius:var(--radius-lg);
  padding:24px 26px;margin-bottom:14px;
  transition:border-color .25s,transform .25s;
}
.exp-item:hover{border-color:var(--border);transform:translateX(4px);}
.exp-item::before{
  content:'';position:absolute;left:-26px;top:24px;
  width:12px;height:12px;border-radius:50%;
  background:var(--gold);border:2px solid var(--bg);
  box-shadow:0 0 10px rgba(212,175,95,0.5);
}
.exp-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:14px;}
.exp-ico{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  background:var(--goldtint);border:1px solid var(--border);
}
.exp-role{font-size:15px;font-weight:600;color:var(--text);}
.exp-co{font-size:13px;color:var(--gold2);margin-top:2px;font-weight:500;}
.exp-meta{
